name: UADR quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  framework:
    name: Framework gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, docs, links, instructions, secrets, context budget
        run: python3 .automation/uadr.py check
      - name: Context audit
        run: python3 .automation/uadr.py audit --check

  project:
    name: Project gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Add your stack's toolchain setup here (setup-node, setup-java, setup-go, ...).
      - name: Setup
        run: python3 .automation/uadr.py run setup || [ $? -eq 3 ]   # exit 3 = not configured
      - name: Lint, static analysis, build, test
        run: python3 .automation/uadr.py run all   # add --strict once commands.test is configured
